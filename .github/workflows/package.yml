name: package

# Windows .msi (cargo-wix), macOS .dmg (.app bundle, unsigned), Linux .deb (cargo-deb) +
# AppImage. Called by release-please.yml with a tag → uploads to that GitHub Release.
# On pull requests touching packaging it only builds (proves the installers still build).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/package.sh'
      - '.github/workflows/package.yml'
      - 'crates/arcana-app/Cargo.toml'
      - 'crates/arcana-app/wix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux }
          - { os: macos-14, target: macos }
          - { os: windows-2022, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev file
      - name: Package
        run: |
          V="${{ inputs.tag }}"
          bash scripts/package.sh ${{ matrix.target }} "${V:-0.0.0}"
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-${{ matrix.target }}
          path: dist/*
      - name: Upload to the GitHub Release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
