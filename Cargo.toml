[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "xtask"]
default-members = ["crates/arcana-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jrjohn/arcana-desktop-rust"

[workspace.dependencies]
arcana-core = { path = "crates/arcana-core" }
arcana-domain = { path = "crates/arcana-domain" }
arcana-data = { path = "crates/arcana-data" }
arcana-sync = { path = "crates/arcana-sync" }
arcana-plugin-api = { path = "crates/arcana-plugin-api" }
arcana-plugin-host = { path = "crates/arcana-plugin-host" }
arcana-plugin-wasm = { path = "crates/arcana-plugin-wasm" }
arcana-infra = { path = "crates/arcana-infra" }
arcana-ui = { path = "crates/arcana-ui" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "x11", "wayland"] }
egui = "0.36"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
rust_decimal_macros = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["sync"] }
egui_dock = "0.21"
egui_kittest = "0.36"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23"
getrandom = "0.2"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }
tracing-appender = "0.2"
dirs = "5"
tempfile = "3"
proptest = "1"
inventory = "0.3"
semver = { version = "1", features = ["serde"] }
quick-xml = "0.39"
flate2 = "1"
percent-encoding = "2"
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "anyhow"] }
wat = "1"
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
# xdg-portal only on Linux: no GTK system dependency; falls back to a path prompt without a portal.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# PBKDF2 runs 100 000 HMAC rounds per hash; unoptimised it takes seconds per test.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
