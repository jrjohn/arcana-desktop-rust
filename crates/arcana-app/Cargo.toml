[package]
name = "arcana-app"
description = "Desktop entry point (C# Arcana.App)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["jrjohn"]
repository.workspace = true

[dependencies]
arcana-ui.workspace = true
arcana-infra.workspace = true
eframe.workspace = true
egui.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
uuid.workspace = true
tracing.workspace = true
# Screenshot tool only (`cargo run -p arcana-app --features screenshots --bin screenshots`):
# renders the real shell offscreen with wgpu. Not part of the CI build.
egui_kittest = { workspace = true, optional = true, features = ["wgpu", "snapshot"] }

[features]
screenshots = ["dep:egui_kittest"]

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "arcana-app"
path = "src/main.rs"

[[bin]]
name = "screenshots"
path = "src/bin/screenshots.rs"
required-features = ["screenshots"]

[lints]
workspace = true


# Packaging (see scripts/package.sh and README "Install").
[package.metadata.deb]
name = "arcana-desktop"
maintainer = "jrjohn"
section = "office"
extended-description = "Arcana enterprise management desktop app (Rust + egui)."
depends = "$auto, libgl1, libegl1, libxkbcommon0, libwayland-client0"
assets = [
    ["target/release/arcana-app", "usr/bin/", "755"],
    ["../../packaging/arcana.desktop", "usr/share/applications/", "644"],
    ["../../packaging/arcana.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]
